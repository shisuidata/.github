    <path d="M727 366C793 368 816 354 863 350C915 346 951 363 998 346C1051 327 1080 287 1124 280C1142 277 1155 278 1168 282" fill="none" stroke="#274a3d" stroke-width="2"/>
  </g>

  <path d="M748 315L813 287L875 299L935 230L1002 250L1084 132L1168 105" fill="none" stroke="#d4aa5a" stroke-opacity="0.16" stroke-width="18" filter="url(#softGlow)"/>
  <path d="M748 315L813 287L875 299L935 230L1002 250L1084 132L1168 105" fill="none" stroke="url(#signal)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <g fill="#efd69d">
    <circle cx="748" cy="315" r="5"/>
    <circle cx="813" cy="287" r="5"/>
    <circle cx="875" cy="299" r="5"/>
    <circle cx="935" cy="230" r="5"/>
    <circle cx="1002" cy="250" r="5"/>
    <circle cx="1084" cy="132" r="5"/>
    <circle cx="1168" cy="105" r="5"/>
  </g>

  <g transform="translate(58 52)">
    <g fill="none" stroke="#d9ba77" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M15 38V10M15 18L7 12M15 26L24 18M37 38V2M37 13L29 7M37 22L46 14M59 38V14M59 22L51 17M59 30L68 23"/>
      <path d="M3 38H71" stroke-opacity="0.5"/>
    </g>
    <text x="92" y="30" fill="#f1eee5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700" letter-spacing="4">SHISUI DATA</text>
  </g>

