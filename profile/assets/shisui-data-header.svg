    <tspan x="58" dy="0">From raw signals</tspan>
    <tspan x="58" dy="68">to trustworthy decisions.</tspan>
  </text>

  <text x="61" y="315" fill="#aac0b5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" letter-spacing="0.8">OPEN-SOURCE SYSTEMS FOR AGENT-NATIVE DATA WORK</text>

  <g transform="translate(60 365)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="1.2">
