<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Shisui Data</title>
  <desc id="desc">From raw signals to trustworthy decisions. Open-source systems for agent-native data work.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c1714"/>
      <stop offset="0.58" stop-color="#10221c"/>
      <stop offset="1" stop-color="#18372b"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#d4aa5a" stop-opacity="0.18"/>
      <stop offset="0.46" stop-color="#e1c17f" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#f0d9a2"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#cce0d6" stroke-opacity="0.055"/>
    </pattern>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <rect width="1200" height="420" rx="24" fill="url(#background)"/>
  <rect width="1200" height="420" rx="24" fill="url(#grid)"/>

  <g opacity="0.72">
    <path d="M727 336C781 315 793 253 844 247C897 241 919 298 970 274C1018 251 1028 167 1092 151C1120 144 1143 155 1168 174" fill="none" stroke="#4f7a67" stroke-width="2"/>
